name: tiris

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment: &backend_environment
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MATERIAL_MAX_BYTES: ${MATERIAL_MAX_BYTES:-20000000}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-200}
      FETCH_DNS_MODE: ${FETCH_DNS_MODE:-system}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-}
      BAILIAN_EMBEDDING_REVISION: ${BAILIAN_EMBEDDING_REVISION:-service-v1}
      EMBEDDING_CACHE_DIR: /models
      SOURCE_CREDENTIAL_KEY_FILE: /run/tiris-secrets/source-key
    volumes:
      - embedding_models:/models:ro
      - source_secrets:/run/tiris-secrets
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/db', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build: ./backend
    environment: *backend_environment
    volumes:
      - embedding_models:/models:ro
      - source_secrets:/run/tiris-secrets:ro
    command: ["celery", "-A", "app.workers.tasks:celery_app", "worker", "--pool=solo", "--concurrency=1", "--loglevel=INFO"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy

  beat:
    build: ./backend
    environment: *backend_environment
    volumes:
      - source_secrets:/run/tiris-secrets:ro
    command: ["celery", "-A", "app.workers.tasks:celery_app", "beat", "--schedule=/tmp/tiris-beat", "--loglevel=INFO"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  embedding_models:
  source_secrets:
